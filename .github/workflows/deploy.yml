name: Deploy GitHub Pages

# Publie le site sur GitHub Pages à chaque fusion sur main.
# Pages est réglé sur « Deploy from a branch » → branche `gh_pages`, dossier `/`.
# Le workflow compile le site (Vite) et pousse le contenu de `dist/` sur
# `gh_pages` : GitHub Pages sert alors le site compilé, et non les sources.
# La branche `gh_pages` est générée : ne pas y committer à la main.
on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

# Un seul déploiement à la fois ; un déploiement en cours n'est pas annulé.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Build project
        run: npm run build

      # Sans .nojekyll, Pages passe le site dans Jekyll, qui ignore les
      # fichiers et dossiers commençant par « _ ».
      - name: Disable Jekyll
        run: touch dist/.nojekyll

      - name: Publish dist/ to gh_pages
        working-directory: dist
        run: |
          git init -q -b gh_pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "deploy: site compilé depuis ${GITHUB_SHA}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git" gh_pages
