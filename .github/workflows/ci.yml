name: CI

on:
  push:
  pull_request:

jobs:
  branch-naming:
    runs-on: ubuntu-latest
    steps:
      - name: Check branch naming convention
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BRANCH="${{ github.head_ref }}"
          else
            BRANCH="${GITHUB_REF#refs/heads/}"
          fi

          echo "Branche : $BRANCH"

          # Branches protégées/de base, exemptées de toute convention
          case "$BRANCH" in
            main|develop|skills)
              echo "Branche protégée, convention non appliquée."
              exit 0
              ;;
          esac

          # Branches transverses (infra, CI, chores) : pas de numéro de groupe imposé
          case "$BRANCH" in
            chore/*|ci/*|setup/*)
              echo "Branche transverse, convention non appliquée."
              exit 0
              ;;
          esac

          # Conventions acceptées :
          #   feat/<groupe>-<feature>  et  fix/<issue>      (CONTRIBUTING.md)
          #   group<1-5>-<feature>                          (legacy, compat)
          PATTERN='^(feat|fix)/[a-z0-9]+(-[a-z0-9]+)*$|^group[1-5]-[a-z0-9]+(-[a-z0-9]+)*$'
          if ! echo "$BRANCH" | grep -Eq "$PATTERN"; then
            echo "::error::Nom de branche invalide : '$BRANCH'"
            echo "::error::Convention attendue : feat/<groupe>-<feature> ou fix/<issue> (voir CONTRIBUTING.md), ex. feat/groupe2-blackjack"
            echo "::error::Branches transverses (chore/*, ci/*, setup/*) exemptées."
            exit 1
          fi

          echo "Nom de branche conforme."

  build-and-test:
    needs: branch-naming
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Build
        run: npm run build

      - name: Test
        run: npm test