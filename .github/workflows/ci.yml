name: CI Casino Fantome

on:
  pull_request:
    branches: [ main ]

jobs:
  quality-gate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

      - name: Run tests
        run: npm test

      - name: Lint check
        run: npm run lint

      - name: Unit tests
        run: npm test

      - name: Build project
        run: npm run build

      - name: Check for forbidden patterns
        run: |
          echo "Checking for Math.random() outside of rng.js..."
          # Search for Math.random() excluding files that should have it
          if grep -r "Math.random()" . --exclude="*rng.js*" --exclude-dir=".github" --exclude-dir="node_modules"; then
            echo "Error: Math.random() is forbidden. Use the Core RNG instead."
            exit 1
          fi
          echo "Checking for 'var' keyword..."
          if grep -r "\bvar\b" . --exclude-dir=".github" --exclude-dir="node_modules"; then
            echo "Error: Use of 'var' is forbidden. Use 'const' or 'let' instead."
            exit 1
          fi
          echo "All checks passed!"
